# Directory-Backed Volume Provisioning StorageClass for Dell PowerScale.
#
# This StorageClass provisions volumes as subdirectories under a shared NFS
# export, each with an individual SmartQuota. This approach eliminates the
# one-export-per-volume bottleneck and supports 100,000+ volumes per cluster.
#
# IMPORTANT: Use a separate StorageClass for directory-backed vs export-backed
# provisioning. Do NOT mix both modes in a single StorageClass.
#
# For traditional export-backed provisioning, see isilon.yaml.

apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: isilon-directory
provisioner: csi-isilon.dellemc.com
reclaimPolicy: Delete
allowVolumeExpansion: true
parameters:
  # Enable directory-backed provisioning mode.
  # When true, volumes are created as subdirectories under SharedExportPath
  # with individual SmartQuotas, rather than as separate NFS exports.
  # Required: true (for this mode)
  DirectoryBacked: "true"

  # The path of the pre-existing shared NFS export on the PowerScale cluster.
  # All directory-backed volumes will be created as subdirectories under this path.
  # The export must already exist and be accessible in the specified AccessZone.
  # Required: true (when DirectoryBacked is "true")
  # Example: /ifs/k8s/shared, /ifs/engineering
  SharedExportPath: /ifs/k8s/shared

  # The name of the access zone the shared export belongs to.
  # Optional: true
  # Default value: default value specified in values.yaml
  # Examples: System
  AccessZone: System

  # Name of PowerScale cluster where volumes will be provisioned.
  # This name should match one of the cluster configs in isilon-creds secret.
  # If not specified, the default cluster config will be used.
  # Optional: true
  # ClusterName: <cluster_name>

  # Initial permissions applied when creating directory-backed volume subdirectories.
  #
  # IMPORTANT: For directory-backed volumes, fsGroup is effectively REQUIRED for non-root
  # pods to have write access. The default "0750" (rwxr-x---) is intentionally restrictive:
  # - Owner (root): read, write, execute
  # - Group (root): read, execute only
  # - Others: no access
  #
  # When your pod specifies securityContext.fsGroup, the CSI driver automatically changes
  # permissions to "2770" (rwxrws---) at mount time via the OneFS management API:
  # - Owner (root): read, write, execute
  # - Group (fsGroup): read, write, execute (with setgid bit for file inheritance)
  # - Others: no access
  #
  # This parameter only affects the INITIAL directory creation. It is typically NOT
  # necessary to change this value since fsGroup will override it at mount time.
  #
  # Default value: "0750" (secure by default, requires fsGroup for write access)
  # Allowed values: valid octal mode number
  # Examples: "0750", "0755", "0700"
  # IsiVolumePathPermissions: "0750"

  # Parameter to set Advisory Limit to quota
  # Optional: true
  # Default Behaviour : Limit not set
  # AdvisoryLimit: "50"
  # Parameter to set soft limit to quota
  # Optional: true
  # Default Behaviour: Limit not set
  # SoftLimit: "80"
  # Parameter which must be mentioned along with Soft Limit
  # Soft Limit can be exceeded until the grace period
  # Optional: true
  # Default Behaviour : Limit not set
  # SoftGracePrd: "86400"

  # When a PVC is being created, this parameter determines whether to add the
  # k8s node to the "Root clients" field or "Clients" field of the shared export.
  # Allowed values: "true", "false"
  # Optional: true
  # Default value: "false"
  RootClientEnabled: "false"

# volumeBindingMode controls when volume binding and dynamic provisioning should occur.
# Allowed values:
#   Immediate: volume binding and provisioning occurs when the PVC is created
#   WaitForFirstConsumer: delays binding until a Pod using the PVC is created
# Default value: Immediate
volumeBindingMode: Immediate

# allowedTopologies helps scheduling pods on worker nodes which match all of below expressions.
# If enableCustomTopology is set to true in helm values.yaml, then do not specify allowedTopologies
# Change all instances of <ISILON_IP> to the IP of the PowerScale OneFS API server
# allowedTopologies:
#  - matchLabelExpressions:
#      - key: csi-isilon.dellemc.com/<ISILON_IP>
#        values:
#          - csi-isilon.dellemc.com

# specify additional mount options for when a Persistent Volume is being mounted on a node.
# To mount volume with NFSv4, specify mount option vers=4. Make sure NFSv4 is enabled on the Isilon Cluster
# mountOptions: ["<mountOption1>", "<mountOption2>", ..., "<mountOptionN>"]
